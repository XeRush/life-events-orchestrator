[project]
name = "lifeloop-backend"
version = "0.2.0"
description = "LifeLoop - voice-first life-event orchestration for expatriate parents in Dubai (Team Symphony, Ignyte x ElevenLabs Voice Agent Challenge prototype)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.53,<0.54",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.15",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "bcrypt>=4.3",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "structlog>=25.1",
    "logifyx>=2.0",
    "redis>=6.0",
    "aiokafka>=0.12",
    "neo4j>=5.28",
    "langgraph>=0.4",
    "langfuse>=3.0",
    "jinja2>=3.1",
    "google-api-python-client>=2.170",
    "google-auth>=2.40",
    "prometheus-client>=0.22",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "aiosqlite>=0.21",
    "ruff>=0.11",
    "google-auth-oauthlib>=1.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "E501", "UP042", "B904", "S101", "S105", "S106", "S311", "S603", "S607", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
