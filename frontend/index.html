<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LifeLoop - one call, one case, every step after birth. A multilingual voice agent that coordinates the post-birth document chain for expatriate parents in Dubai (prototype by Team Symphony)." />
    <meta name="theme-color" content="#f7f5f0" />
    <script>
      /* Apply the saved theme before first paint (light by default) so the page never flashes. */
      (function () {
        try {
          var pref = localStorage.getItem("lifeloop.theme") || "light";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Malayalam:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>LifeLoop - One call. One case. Every step after birth.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
